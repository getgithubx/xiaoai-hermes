hardware: LX04
# 使用 LX04 的 MiNA ai_tts_request 播报；原 MIoT 命令接口目前报错，会使桥接在回答前退出。
# 依赖 bridge.py 中的 LX04MiNAService；仅改此开关而使用上游旧 text_to_speech 方法会请求成功却不出声。
use_command: false
tts: mi
bot: chatgptapi
api_base: http://127.0.0.1:8642/v1
stream: false
mute_xiaoai: true
verbose: 0
keyword: []
change_prompt_keyword: []
start_conversation: ""
end_conversation: ""
prompt: "你正在通过小爱音箱与用户对话。请用简洁自然的中文回答，通常不超过150字，不读Markdown符号；较长任务先简要说明结果。"
gpt_options:
  model: hermes-agent
  timeout: 180
